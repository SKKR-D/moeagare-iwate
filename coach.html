<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>【公式】監督ポータル</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #f1f5f9; --surface: #ffffff; --border: #94a3b8; --text: #0f172a; --text-dim: #475569; --blue-active: #0284c7; --red-active: #ea580c; --gold: #d97706; --green: #16a34a; --error: #f43f5e; }
        * { box-sizing: border-box; margin: 0; padding: 0; touch-action: manipulation; }
        body { font-family: 'Noto Sans JP', sans-serif; background: var(--bg); color: var(--text); padding-bottom: 50px;}
        .header { background: #1e293b; color: white; padding: 15px; text-align: center; position: sticky; top: 0; z-index: 100;}
        .team-name { font-size: 1.2rem; font-weight: 900; color: #38bdf8; }
        .container { max-width: 500px; margin: 0 auto; padding: 15px; }
        .card { background: var(--surface); border-radius: 12px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
        h2 { font-size: 1.1rem; border-bottom: 2px solid var(--border); padding-bottom: 5px; margin-bottom: 15px; color: var(--blue-active); }
        .input-group { margin-bottom: 10px; display: flex; align-items: center; gap: 10px; }
        .input-group label { font-weight: 900; width: 40px; text-align: right; color: var(--text-dim); }
        .text-input, .select-input { flex: 1; padding: 12px; border: 2px solid var(--border); border-radius: 8px; font-size: 1rem; font-weight: bold; background: #fff;}
        .text-input:focus, .select-input:focus { border-color: var(--blue-active); outline: none; }
        .btn { width: 100%; padding: 15px; border: none; border-radius: 10px; color: white; font-size: 1.1rem; font-weight: 900; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .btn-green { background: linear-gradient(135deg, var(--green), #15803d); }
        .btn-blue { background: linear-gradient(135deg, var(--blue-active), #0369a1); margin-top: 15px;}
        .btn:disabled { background: #94a3b8; cursor: not-allowed; box-shadow: none; }
        .order-pair { background: #f8fafc; border: 1px solid #cbd5e1; padding: 10px; border-radius: 8px; margin-bottom: 10px; }
        .pair-title { font-weight: bold; font-size: 0.9rem; margin-bottom: 5px; color: var(--text-dim); }
        .error-msg { color: var(--error); font-weight: bold; font-size: 0.85rem; text-align: center; margin-top: 10px; display: none; }
        .tab-wrap { display: flex; gap: 10px; margin-bottom: 15px; }
        .tab { flex: 1; text-align: center; padding: 10px; background: #e2e8f0; border-radius: 8px; font-weight: bold; color: var(--text-dim); cursor: pointer;}
        .tab.active { background: var(--blue-active); color: white; }
        .success-box { background: #dcfce7; border: 2px solid var(--green); color: #166534; padding: 20px; text-align: center; font-weight: 900; border-radius: 12px; }
    </style>
</head>
<body>
    <div class="header">
        <div style="font-size: 0.8rem; font-weight: bold;">監督ポータル</div>
        <div class="team-name" id="display-team-name">認証中...</div>
    </div>

    <div class="container">
        <div class="tab-wrap">
            <div class="tab active" id="tab-reg" onclick="switchTab('reg')">① 選手登録</div>
            <div class="tab" id="tab-order" onclick="switchTab('order')">② オーダー作成</div>
        </div>

        <div class="card" id="panel-reg">
            <h2>自チーム選手登録（8名）</h2>
            <div id="reg-form-area">
                <p style="font-size: 0.8rem; color: #64748b; margin-bottom: 15px;">※大会当日の朝、受付として送信してください。</p>
                <div id="player-inputs"></div>
                <button class="btn btn-green" id="btn-submit-players" onclick="submitPlayers()" disabled>選手リストを送信（受付）</button>
                <div id="reg-msg" class="error-msg"></div>
            </div>
            <div id="reg-done-area" style="display:none;" class="success-box">
                ✅ 今日の受付は完了しています
            </div>
        </div>

        <div class="card" id="panel-order" style="display: none;">
            <h2>オーダー提出</h2>
            <div class="input-group" style="margin-bottom: 15px;">
                <label style="width:70px; text-align:left;">試合番号</label>
                <select id="match-id" class="select-input" onchange="checkDuplicates()">
                    <option value="">読込中...</option>
                </select>
            </div>

            <div class="order-pair"><div class="pair-title">第1マッチ</div><div style="display: flex; gap: 5px;"><select class="select-input p-select" id="o1a" onchange="updateDynamicSelects()"></select><select class="select-input p-select" id="o1b" onchange="updateDynamicSelects()"></select></div></div>
            <div class="order-pair"><div class="pair-title">第2マッチ</div><div style="display: flex; gap: 5px;"><select class="select-input p-select" id="o2a" onchange="updateDynamicSelects()"></select><select class="select-input p-select" id="o2b" onchange="updateDynamicSelects()"></select></div></div>
            <div class="order-pair"><div class="pair-title">第3マッチ</div><div style="display: flex; gap: 5px;"><select class="select-input p-select" id="o3a" onchange="updateDynamicSelects()"></select><select class="select-input p-select" id="o3b" onchange="updateDynamicSelects()"></select></div></div>

            <div id="order-error" class="error-msg"></div>
            <button class="btn btn-blue" id="btn-submit-order" onclick="submitOrder()" disabled>オーダーを送信</button>
        </div>
    </div>

    <script>
        const API = "https://script.google.com/macros/s/AKfycbx5_cG0rpznrzTGXXCNpu3lxX-8ivMQbYW3aQZwS2z56weEu13a8oz4Q8XUlGdQfcU/exec";
        const urlParams = new URLSearchParams(window.location.search);
        const teamId = urlParams.get('t');
        const token = urlParams.get('k');
        
        let teamName = "テストモード";
        let registeredPlayers = []; 

        window.onload = async () => {
            const playerInputs = document.getElementById('player-inputs');
            for(let i=1; i<=8; i++) {
                playerInputs.innerHTML += `<div class="input-group"><label>No.${i}</label><input type="text" id="p${i}" class="text-input" placeholder="選手 ${i} 氏名" oninput="validateRegForm()"></div>`;
            }

            if (!teamId || !token) {
                document.getElementById('display-team-name').textContent = "テスト";
                return;
            }

            try {
                // チーム情報取得
                const res = await fetch(`${API}?action=getTeamInfo&t=${teamId}&k=${token}`).then(r => r.json());
                if (res.status === "success") {
                    teamName = res.teamName;
                    document.getElementById('display-team-name').textContent = teamName;
                    
                    // ① 登録済みなら完了画面を表示
                    if (res.isRegistered) {
                        registeredPlayers = res.players;
                        document.getElementById('reg-form-area').style.display = 'none';
                        document.getElementById('reg-done-area').style.display = 'block';
                    } else {
                        document.getElementById('btn-submit-players').disabled = false;
                        if (res.players) res.players.forEach((p, idx) => { if (document.getElementById(`p${idx+1}`)) document.getElementById(`p${idx+1}`).value = p; });
                    }
                }
                
                // ② 試合番号プルダウンの生成
                const statusRes = await fetch(`${API}?action=getSystemStatus`).then(r => r.json());
                const matchSel = document.getElementById('match-id');
                matchSel.innerHTML = '<option value="">▼ 試合を選択 ▼</option>';
                statusRes.allMatches.forEach(m => {
                    matchSel.innerHTML += `<option value="${m}">${m}</option>`;
                });

            } catch (e) {
                document.getElementById('display-team-name').textContent = "❌ 通信エラー";
            }
        };

        function validateRegForm() {
            let hasAny = false;
            for(let i=1; i<=8; i++) if(document.getElementById(`p${i}`).value.trim()) hasAny = true;
            document.getElementById('btn-submit-players').disabled = !hasAny;
        }

        function switchTab(tab) {
            document.getElementById('tab-reg').classList.remove('active');
            document.getElementById('tab-order').classList.remove('active');
            document.getElementById('panel-reg').style.display = 'none';
            document.getElementById('panel-order').style.display = 'none';
            document.getElementById('tab-' + tab).classList.add('active');
            document.getElementById('panel-' + tab).style.display = 'block';
            if(tab === 'order') updateDynamicSelects();
        }

        async function submitPlayers() {
            const btn = document.getElementById('btn-submit-players');
            btn.disabled = true; btn.textContent = "送信中...";
            registeredPlayers = [];
            for(let i=1; i<=8; i++) {
                const name = document.getElementById(`p${i}`).value.trim();
                if(name) registeredPlayers.push(name);
            }
            if(registeredPlayers.length < 4) { alert("4名以上の登録が必要です"); btn.disabled = false; return; }

            const targetUrl = `${API}?action=REGISTER_PLAYERS&teamId=${teamId}&token=${token}&players=${encodeURIComponent(JSON.stringify(registeredPlayers))}`;
            try {
                await fetch(targetUrl, { mode: 'no-cors' });
                document.getElementById('reg-form-area').style.display = 'none';
                document.getElementById('reg-done-area').style.display = 'block';
                switchTab('order');
            } catch (e) {
                alert("送信に失敗しました。"); btn.disabled = false;
            }
        }

        // ③ 動的フィルタリング機能
        function updateDynamicSelects() {
            const selects = Array.from(document.querySelectorAll('.p-select'));
            const currentValues = selects.map(sel => sel.value); // 現在選択されている値を保持

            selects.forEach((sel, index) => {
                const myValue = currentValues[index];
                sel.innerHTML = '<option value="">▼ 選択 ▼</option>';
                
                registeredPlayers.forEach(p => {
                    // 他のプルダウンで選ばれていないかチェック
                    const isUsedElsewhere = currentValues.some((val, i) => i !== index && val === p);
                    if (!isUsedElsewhere) {
                        sel.innerHTML += `<option value="${p}">${p}</option>`;
                    }
                });
                sel.value = myValue; // 値を復元
            });
            checkDuplicates();
        }

        function checkDuplicates() {
            const selects = document.querySelectorAll('.p-select');
            let allFilled = true;
            selects.forEach(sel => { if(sel.value === "") allFilled = false; });
            const matchId = document.getElementById('match-id').value;
            
            const btn = document.getElementById('btn-submit-order');
            btn.disabled = (!allFilled || matchId === "");
        }

        async function submitOrder() {
            const btn = document.getElementById('btn-submit-order');
            btn.disabled = true; btn.textContent = "送信中...";
            const matchId = document.getElementById('match-id').value;
            
            const o1 = encodeURIComponent(JSON.stringify([document.getElementById('o1a').value, document.getElementById('o1b').value]));
            const o2 = encodeURIComponent(JSON.stringify([document.getElementById('o2a').value, document.getElementById('o2b').value]));
            const o3 = encodeURIComponent(JSON.stringify([document.getElementById('o3a').value, document.getElementById('o3b').value]));
            const tName = encodeURIComponent(teamName);

            const targetUrl = `${API}?action=SUBMIT_ORDER&matchId=${matchId}&teamName=${tName}&o1=${o1}&o2=${o2}&o3=${o3}`;
            
            try {
                await fetch(targetUrl, { mode: 'no-cors' });
                alert(`試合番号 【${matchId}】 のオーダーを送信しました！`);
                document.querySelectorAll('.p-select').forEach(sel => sel.value = "");
                document.getElementById('match-id').value = "";
                updateDynamicSelects();
            } catch (e) {
                alert("送信に失敗しました。");
            } finally {
                btn.disabled = false; btn.textContent = "オーダーを送信"; checkDuplicates();
            }
        }
    </script>
</body>
</html>
